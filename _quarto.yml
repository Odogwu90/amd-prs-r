# Quarto project file. Kept at the repo root (not in report/) so that code
# chunks execute with the repository root as working directory; that makes R
# source .Rprofile (renv + here) exactly as `Rscript R/0x_*.R` does.
project:
  type: default
  execute-dir: project
  output-dir: _site          # rendered output goes here (gitignored); this is
                             # what `quarto publish gh-pages` uploads
  render:
    - report/report.qmd
